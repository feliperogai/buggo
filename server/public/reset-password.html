<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redefinir senha — Buggo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F4F2FB;
    color: #1F1B2E;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(100, 42, 228, 0.12);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #642AE4; }
  p.sub { margin: 0 0 24px; color: #6B6478; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid #E4E0F2;
    margin-bottom: 16px;
    font-size: 15px;
    box-sizing: border-box;
  }
  input:focus { outline: none; border-color: #642AE4; }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #642AE4;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #message { margin-top: 16px; font-size: 14px; text-align: center; }
  #message.error { color: #D64545; }
  #message.success { color: #2E9E5B; }
</style>
</head>
<body>
  <div class="card">
    <h1>Redefinir senha</h1>
    <p class="sub">Escolha uma nova senha para sua conta Buggo.</p>
    <form id="form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password" />
      <label for="confirm">Confirmar senha</label>
      <input id="confirm" type="password" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="submit">Redefinir senha</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = type;
    }

    if (!token) {
      showMessage('Link inválido: token ausente.', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 6) {
        showMessage('A senha precisa ter pelo menos 6 caracteres.', 'error');
        return;
      }
      if (password !== confirm) {
        showMessage('As senhas não coincidem.', 'error');
        return;
      }

      submitBtn.disabled = true;
      showMessage('Enviando...', '');

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Não foi possível redefinir a senha.');
        }
        showMessage('Senha redefinida com sucesso! Volte ao app e faça login.', 'success');
        form.style.display = 'none';
      } catch (err) {
        showMessage(err instanceof Error ? err.message : 'Erro inesperado.', 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
