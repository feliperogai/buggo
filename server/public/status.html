<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Status do servidor — Buggo</title>
<style>
  :root {
    --bg: #14032f;
    --card: #1f0a46;
    --line: #33195e;
    --text: #f4f1fb;
    --muted: #a99cc4;
    --primary: #7c3aed;
    --ok: #10b981;
    --warn: #f59e0b;
    --fail: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .banner {
    margin-top: 20px;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted);
  }
  .banner.ok { border-left-color: var(--ok); }
  .banner.degraded { border-left-color: var(--warn); }
  .banner.down, .banner.unreachable { border-left-color: var(--fail); }
  .banner h2 { margin: 0; font-size: 17px; }
  .banner p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li {
    display: flex;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    margin-bottom: 8px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    margin-top: 6px; flex: 0 0 auto; background: var(--muted);
  }
  .dot.ok { background: var(--ok); }
  .dot.off { background: var(--warn); }
  .dot.fail { background: var(--fail); }
  .label { font-weight: 600; font-size: 14px; }
  .detail { color: var(--muted); font-size: 13px; margin-top: 2px; word-break: break-word; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 1px; }

  footer { margin-top: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    background: var(--primary); color: #fff; border: 0; border-radius: 10px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .meta { color: var(--muted); font-size: 12px; }
  code { background: #00000040; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Buggo · Status do servidor</h1>
  <p class="sub">Leitura ao vivo de <code>/api/health</code>. Atualiza sozinho a cada 30s.</p>

  <div class="banner" id="banner">
    <h2 id="banner-title">Verificando…</h2>
    <p id="banner-detail">Consultando o servidor.</p>
  </div>

  <ul id="checks"></ul>

  <footer>
    <button id="refresh">Atualizar agora</button>
    <span class="meta" id="meta"></span>
  </footer>
</main>

<script>
  const BANNERS = {
    ok:          { klass: 'ok',          title: 'Tudo funcionando' },
    degraded:    { klass: 'degraded',    title: 'Funcionando com pendências' },
    down:        { klass: 'down',        title: 'Servidor fora do ar' },
    unreachable: { klass: 'unreachable', title: 'Servidor inacessível' },
  };

  const banner = document.getElementById('banner');
  const bannerTitle = document.getElementById('banner-title');
  const bannerDetail = document.getElementById('banner-detail');
  const list = document.getElementById('checks');
  const meta = document.getElementById('meta');
  const button = document.getElementById('refresh');

  function show(state, detail) {
    const info = BANNERS[state] || BANNERS.unreachable;
    banner.className = 'banner ' + info.klass;
    bannerTitle.textContent = info.title;
    bannerDetail.textContent = detail;
  }

  function render(checks) {
    list.innerHTML = '';
    for (const check of checks) {
      const item = document.createElement('li');

      const dot = document.createElement('span');
      dot.className = 'dot ' + check.status;
      item.appendChild(dot);

      const body = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = check.label;
      if (!check.required) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'opcional';
        label.appendChild(tag);
      }
      const detail = document.createElement('div');
      detail.className = 'detail';
      detail.textContent = check.detail;

      body.appendChild(label);
      body.appendChild(detail);
      item.appendChild(body);
      list.appendChild(item);
    }
  }

  async function check() {
    button.disabled = true;
    const started = Date.now();
    try {
      // `cache: no-store` para a resposta nunca vir de um cache do navegador —
      // um monitor que mostra o estado de dez minutos atrás é pior que nenhum.
      const response = await fetch('/api/health', { cache: 'no-store' });
      const text = await response.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch (_) {
        // HTML no lugar de JSON é quase sempre a tela de login da Vercel
        // (Deployment Protection) — o mesmo muro que bloqueia o app.
        show('unreachable',
          'O servidor respondeu HTML em vez de JSON (HTTP ' + response.status + '). ' +
          'Se for a tela de login da Vercel, desligue a Deployment Protection ' +
          'em Settings > Deployment Protection — é ela que também bloqueia o app.');
        list.innerHTML = '';
        return;
      }

      show(data.status, data.summary || '');
      render(data.checks || []);
      const parts = [
        'ambiente: ' + (data.environment || '—'),
        data.region ? 'região: ' + data.region : null,
        data.commit ? 'commit: ' + data.commit : null,
        'resposta: ' + (Date.now() - started) + ' ms',
        'às ' + new Date().toLocaleTimeString('pt-BR'),
      ].filter(Boolean);
      meta.textContent = parts.join(' · ');
    } catch (error) {
      show('unreachable', 'Não foi possível falar com o servidor: ' + error.message);
      list.innerHTML = '';
      meta.textContent = 'tentativa às ' + new Date().toLocaleTimeString('pt-BR');
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener('click', check);
  check();
  setInterval(check, 30000);
</script>
</body>
</html>
