name: buggo
description: Learn programming like a game
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  image_picker: ^1.1.2
  flutter_dotenv: ^6.0.1
  lottie: ^3.3.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.1.0
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_buggo.png"
  min_sdk_android: 21
  # O ícone é preenchido de ponta a ponta: o fundo da adaptive icon é a
  # própria cor do ícone (#1E0145), e o foreground é só o glifo branco em
  # transparência (gerado por `dart run tool/icon_layers.dart`). Assim não
  # sobra anel de outra cor em volta do desenho.
  adaptive_icon_background: "#1E0145"
  adaptive_icon_foreground: "assets/images/icon_buggo_foreground.png"
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: "#1E0145"
  windows:
    generate: true
    image_path: "assets/images/icon_buggo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon_buggo.png"
